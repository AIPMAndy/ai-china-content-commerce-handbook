name: Test and publish handbook
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes to authoritative PDF source
        id: pdf_inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual release: full PDF regeneration required"
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base="$BASE_SHA"
            else
              base="$BEFORE_SHA"
            fi
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Unknown baseline: full PDF regeneration required"
            else
              git diff --name-only "$base" "$HEAD_SHA" > /tmp/site-change-paths
              if grep -Eq '^(data/|content/|research/|prompts/|docs/|examples/|templates/|pdf/|site/downloads/|scripts/(build_data|build_pdf|pdf_quality_gate)\.py)' /tmp/site-change-paths; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "PDF source changed: regenerate + full-page QA"
              else
                echo "changed=false" >> "$GITHUB_OUTPUT"
                echo "Site-only change: reuse byte-identical archived PDF; still run full-page QA"
                test -s site/downloads/ai-china-content-commerce-handbook.pdf
                test -s pdf/ai-china-content-commerce-handbook-guide.pdf
                cmp site/downloads/ai-china-content-commerce-handbook.pdf pdf/ai-china-content-commerce-handbook-guide.pdf
              fi
            fi
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild evidence, lessons and site
        run: |
          python scripts/build_data.py
          python scripts/build_site.py
      - name: Python consistency tests
        run: python -m unittest discover -s tests -v
      - name: Financial model tests
        run: node --test tests/test_model.js
      - name: Build searchable Chinese PDF
        if: steps.pdf_inputs.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b poppler-utils
          python -m pip install --disable-pip-version-check weasyprint==68.0
          export PDF_EDITION_DATE=2026-11-14
          python scripts/build_pdf.py
          mkdir -p pdf
          cp site/downloads/ai-china-content-commerce-handbook.pdf pdf/ai-china-content-commerce-handbook-guide.pdf
          test -s pdf/ai-china-content-commerce-handbook-guide.pdf
          pdftotext pdf/ai-china-content-commerce-handbook-guide.pdf - | grep -q 'AI 中国内容电商'
      - name: Full-page PDF automated QA and contact sheets
        run: |
          python -m pip install --disable-pip-version-check pymupdf==1.26.6 pillow==12.0.0
          python scripts/pdf_quality_gate.py
      - name: Preserve PDF QA report and all-page visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-commerce-pdf-qa
          path: artifacts/pdf-qa/
          if-no-files-found: warn
          retention-days: 30
      - name: Chromium three-viewport browser and real CSV regression
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m http.server 8765 --directory site > /tmp/content-commerce-http.log 2>&1 &
          node tests/browser_smoke.cjs
      - name: Store reproducible browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-commerce-browser-qa
          path: artifacts/browser-qa/
          if-no-files-found: warn
          retention-days: 30
      - name: Sync generated chapter and case pages to main
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/chapters/ site/cases/ site/downloads/ pdf/
          if ! git diff --cached --quiet; then
            git commit -m "docs(site): synchronize generated website and PDF publication assets"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  live_verify:
    name: Verify actual Pages resources and PDF SHA
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify live HTML, sitemap, robots and PDF against repository edition
        run: |
          set -euo pipefail
          BASE="https://aipmandy.github.io/ai-china-content-commerce-handbook"
          local_pdf="site/downloads/ai-china-content-commerce-handbook.pdf"
          test -s "$local_pdf"
          expected="$(sha256sum "$local_pdf" | cut -d' ' -f1)"
          revision="$(git rev-parse HEAD)"
          pass=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 25 "$BASE/?v=$revision" -o /tmp/live-home.html \
               && grep -q 'downloads/ai-china-content-commerce-handbook.pdf' /tmp/live-home.html \
               && curl -fsSL --max-time 25 "$BASE/downloads/ai-china-content-commerce-handbook.pdf?v=$revision" -o /tmp/live-handbook.pdf \
               && [ "$(sha256sum /tmp/live-handbook.pdf | cut -d' ' -f1)" = "$expected" ] \
               && curl -fsSL --max-time 25 "$BASE/sitemap.xml?v=$revision" -o /tmp/live-sitemap.xml \
               && curl -fsSL --max-time 25 "$BASE/robots.txt?v=$revision" -o /tmp/live-robots.txt; then
              pass=1; break
            fi
            sleep 10
          done
          [ "$pass" -eq 1 ] || { echo "Live Pages HTTP / PDF SHA failed"; exit 1; }
          grep -q 'aipmandy.github.io/ai-china-content-commerce-handbook' /tmp/live-sitemap.xml
          for rel in index.html assets/app.js assets/model.js assets/style.css sitemap.xml robots.txt chapters/01.html cases/C001.html; do
            local="site/$rel"
            target="/tmp/live-$(basename "$rel")"
            test -s "$local"
            ok=0
            for attempt in $(seq 1 12); do
              if curl -fsSL --max-time 25 "$BASE/$rel?v=$revision" -o "$target" \
                 && [ "$(sha256sum "$target" | cut -d' ' -f1)" = "$(sha256sum "$local" | cut -d' ' -f1)" ]; then
                ok=1; break
              fi
              sleep 10
            done
            [ "$ok" -eq 1 ] || { echo "Live generated page differs: $rel"; exit 1; }
            if [[ "$rel" == chapters/* || "$rel" == cases/* ]]; then
              grep -q 'application/ld+json' "$target"
              grep -q '来源台账日期' "$target"
            fi
            echo "LIVE VERIFIED byte-exact $BASE/$rel"
          done
          echo "LIVE VERIFIED $BASE/ and PDF SHA256=$expected"
