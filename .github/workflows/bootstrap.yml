name: Import complete AI content commerce handbook
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/project.tar.xz.b64'
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify, unpack and test original 227-file project
        shell: bash
        run: |
          base64 --decode .bootstrap/project.tar.xz.b64 > /tmp/ai-commerce.tar.xz
          echo "fcee3c8d4648a167e10ee3560d66c3fe33865ea835102acfff29bdde0f57e1ba  /tmp/ai-commerce.tar.xz" | sha256sum --check
          tar -xJf /tmp/ai-commerce.tar.xz --strip-components=1
          python scripts/build_data.py
          python scripts/build_site.py
          python -m unittest discover -s tests -v
          node --test tests/test_model.js
      - name: Commit content (site workflow will be added separately)
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: import complete AI China content commerce handbook v1.0"
          git push origin HEAD:main
